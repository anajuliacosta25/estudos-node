<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Minha Calculadora</h1>

    <div>
        <input type="number" id="numero1" placeholder="Digite o primeiro número">

        <input type="number" id="numero2" placeholder="Digite o segundo número">
    </div>

    <div>
        <button id="somar">+</button>
        <button id="subtrair">-</button>
        <button id="multiplicar">*</button>
        <button id="dividir">/</button>
    </div>

    <h2 id="resultado">Resultado: </h2>

    <script src="script.js"></script>

</body>
</html>
